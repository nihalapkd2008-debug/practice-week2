<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<style>
  button {
    background-color: tomato;
    color: rgb(0, 0, 0);

    border-radius: 50%;
    margin: 25px;
    height: 200px;
    width: 300px;

  }

  button:hover {
    background-color: rgb(255, 226, 5);

  }

  li:nth-child(2) {
    color: red;
  }

  .card {
    width: 250px;
    padding: 60px;
    border: 1px solid rgb(205, 64, 64);
    background-color: burlywood;
    transition: 0.3s;
  }

  .card:hover {
    transform: scale(1.1);
  }

  .box {
    width: 150px;
    height: 150px;
    margin: 10px;
    padding: 6px;
    border: 1px solid rgb(0, 0, 0);
    overflow: auto;

  }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 25px;

  }

  .container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .box {
    background-color: lightblue;
    padding: 20px;
    text-align: center;
  }

  /* Mobile Layout */
  @media (max-width:768px) {

    .container {
      grid-template-columns: 1fr;
    }

  }

  .loader {
    width: 50px;
    height: 50px;

    border: 5px solid rgb(255, 155, 155);
    border-top: 5px solid rgb(0, 0, 0);
    border-radius: 50%;
    animation: spin 1s infinite linear;


  }

  @keyframes spin {

    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  h1 {
    position: relative;
  }

  h1::after {
    content: "________";
    color: red;
    display: block;
    width: 100px;
    margin-top: -30px;

  }

  h2 {
    color: red;

  }

  .heading {
    color: blue;
  }

  #title {
    color: green;
  }
</style>
</head>

<body>
  <button>click me</button>
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>
  <div class="card">card content</div>
  <div class="box">
    Lorem ipsum dolor sit amet... <br>
    Lorem ipsum dolor sit amet... <br>
    Lorem ipsum dolor sit amet... <br>
    Lorem ipsum dolor sit amet... <br>
    Lorem ipsum dolor sit amet... <br>

  </div>
  <div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>
  <div class="container">
    <div class="box"> box 1</div>
    <div class="box"> box 2</div>
    <div class="box"> box 3</div>
    <div class="box"> box 4</div>
    <div class="box"> box 5</div>
    <div class="box"> box 6</div>
  </div>

  <div class="loader"></div>
  <h1>welcome</h1>
  <h3 id="title" class="heading">Hello</h1>
    <div class="bg-white p-4 rounded shadow w-full md:w-1/2 lg:w-1/3">
      <h2 class="text-xl font-bold">
        Card Title
      </h2>

      <p>
        Card Content
      </p>

    </div>
</body>

</html>

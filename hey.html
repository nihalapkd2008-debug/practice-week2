<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    button {
      background-color: tomato;
      color: rgb(0, 0, 0);
      
      border-radius: 50%;
      margin: 25px;
      height: 200px;
      width: 300px;

    }

    button:hover {
      background-color: rgb(255, 226, 5);

    }
   li:nth-child(2){
    color: red;
   }
   .card{
    width: 250px;
    padding: 60px;
    border: 1px solid rgb(205, 64, 64);
    background-color: burlywood;
    transition: 0.3s;
   }
   .card:hover{
    transform: scale(1.1);
   }

   .box{
    width: 150px;
    height: 150px;
    margin: 10px;
    padding: 6px;
    border: 1px solid rgb(0, 0, 0);
    overflow: auto;

   }
   .container{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 25px;
  
   }

  </style>
</head>

<body>
  <button>click me</button>
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>
  <div class="card">card content</div>
  <div class="box">
  Lorem ipsum dolor sit amet... <br>
  Lorem ipsum dolor sit amet... <br>
  Lorem ipsum dolor sit amet... <br>
  Lorem ipsum dolor sit amet... <br>
  Lorem ipsum dolor sit amet... <br>

  </div>
  <div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>
</body>

</html>

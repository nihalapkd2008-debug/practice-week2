<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    button {
      background-color: tomato;
      color: rgb(0, 0, 0);
      
      border-radius: 50%;
      margin: 25px;
      height: 200px;
      width: 300px;

    }

    button:hover {
      background-color: rgb(255, 226, 5);

    }
   li:nth-child(2){
    color: red;
   }
   .card{
    width: 400px;
    padding: 60px;
    border: 1px solid rgb(205, 64, 64);
   }
   .card:hover{
    transform: scale(1.1);
   }
  </style>
</head>

<body>
  <button>click me</button>
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>
  <div class="card">card content</div>
</body>

</html>

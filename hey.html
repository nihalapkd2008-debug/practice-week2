<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    button {
      background-color: tomato;
      color: rgb(0, 0, 0);
      
      border-radius: 50%;
      margin: 25px;
      height: 200px;
      width: 300px;

    }

    button:hover {
      background-color: rgb(255, 226, 5);

    }
    li:nth-child(2){
      color: mediumorchid;
    }
  </style>
</head>

<body>
  <button>click me</button>
  <ul>
    <li>item 1</li>
    <li>item 2</li>
    <li>item 3</li>
  </ul>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation</title>

<style>
body{
  margin:0;
}

div{
  width:100px;
  height:100px;
  background:red;
  position:relative;
  animation:square 4s linear 2s infinite alternate;
}

@keyframes square{

  0%{
    background:red;
    left:0;
    top:0;
  }

  25%{
    background:lime;
    left:500px;
    top:0;
  }

  50%{
    background:blue;
    left:500px;
    top:500px;
    border-radius:50%;
  }

  75%{
    background:rgb(239, 140, 239);
    left:0;
    top:500px;
  }

  100%{
    background:maroon;
    left:0;
    top:0;
    border-radius:0;
  }
}
</style>
</head>

<body>
  <h1>CSS Animation</h1>
  <div></div>
</body>
</html>

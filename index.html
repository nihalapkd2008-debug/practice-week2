<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      width: 100px;
      height: 100px;
      background-color: red;
      position: relative;

      animation: square 4s linear 2s infinite alternate backwards running;
    }

    @keyframes square {

      0% {
        background-color: red;
        left: 0px;
        top: 0px;
      }

      25% {
        background-color: lime;
        left: 500px;
        top: 0px;

      }

      50% {
        background-color: blue;
        left: 500px;
        top: 500px;
        border-radius: 50%;
      }

      75% {
        background-color: purple;
        left: 0px;
        top: 500px;

      }

      100% {
        background-color: maroon;
        left: 0px;
        top: 0px;
        border-radius: 0px;

        */ body {
          margin: 0px;
          background: #6cffa2;
        }

        div {
          width: 150px;
          height: 100px;
          margin: 10px;
          background: white;
          animation: expand 2s ease-in 2s 5;
        }

        @keyframes expand {
          0% {
            width: 200px;

          }

          50% {
            width: 600px;
          }

          100% {
            width: 200px;
          }
        }
  </style>
</head>

<body>
  <h1 class="title">CSS Animation</h1>

  <div></div>
</body>

</html>
